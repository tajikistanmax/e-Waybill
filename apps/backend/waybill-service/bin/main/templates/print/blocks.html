<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tg">
<!--
  Общие блоки печатных бланков ПЛ.
  Подключение: <th:block th:replace="~{print/blocks :: admission}"/>

  Блок допуска к рейсу («Барои ба кор баромадан иҷозат дода шуд»): на бумажном
  бланке утверждённой формы эти графы подписывались от руки. Здесь они заполнены
  данными электронных подписей путевого листа — титулов Т2 (предрейсовый
  медосмотр), Т3 (предрейсовый техконтроль), Т1 (выпуск и выдача задания),
  при наличии — Т6 (послерейсовый медосмотр): Ф. И. О. подписанта, вердикт,
  отпечаток ЭП и время подписания.
-->
<body>
<th:block th:fragment="admission">
    <div class="section">
        <table class="bordered">
            <tr>
                <th style="width: 25%">Ҳолати саломатии ронанда хуб аст</th>
                <th style="width: 25%">Нақлиёт коршоям аст (баромад / даромад)</th>
                <th style="width: 25%">Ронанда нақлиётро қабул кард (супорид)</th>
                <th style="width: 25%">Супориш дода шуд, ба кор иҷозат дода шуд</th>
            </tr>
            <tr>
                <td>
                    <div class="line" th:text="${doctorMark.name}"></div>
                    <div class="caption" style="text-align:left">
                        Духтур · <span th:text="${doctorMark.verdict}"></span>
                        <th:block th:if="${doctorMark.present}"><br/>ЭП <span th:text="${doctorMark.fingerprint}"></span>
                            · <span th:text="${doctorMark.signedAt}"></span></th:block>
                    </div>
                </td>
                <td>
                    <div class="line" th:text="${mechanicMark.name}"></div>
                    <div class="caption" style="text-align:left">
                        Назоратчии техникӣ · <span th:text="${mechanicMark.verdict}"></span>
                        <th:block th:if="${mechanicMark.present}"><br/>ЭП <span th:text="${mechanicMark.fingerprint}"></span>
                            · <span th:text="${mechanicMark.signedAt}"></span></th:block>
                    </div>
                </td>
                <td>
                    <div class="line">&#160;</div>
                    <div class="caption" style="text-align:left">Ронанда (имзо)</div>
                </td>
                <td>
                    <div class="line" th:text="${dispatcherMark.name}"></div>
                    <div class="caption" style="text-align:left">
                        Танзимгар · <span th:text="${dispatcherMark.verdict}"></span>
                        <th:block th:if="${dispatcherMark.present}"><br/>ЭП <span th:text="${dispatcherMark.fingerprint}"></span>
                            · <span th:text="${dispatcherMark.signedAt}"></span></th:block>
                    </div>
                </td>
            </tr>
            <tr th:if="${postDoctorMark.present}">
                <td colspan="4" class="caption" style="text-align:left">
                    Муоинаи баъдисафарии тиббӣ (Т6): <span th:text="${postDoctorMark.name}"></span> ·
                    <span th:text="${postDoctorMark.verdict}"></span> ·
                    ЭП <span th:text="${postDoctorMark.fingerprint}"></span> ·
                    <span th:text="${postDoctorMark.signedAt}"></span>
                </td>
            </tr>
        </table>
    </div>
</th:block>
</body>
</html>
