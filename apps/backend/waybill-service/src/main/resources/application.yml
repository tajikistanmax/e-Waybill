server:
  port: 8082

spring:
  application:
    name: waybill-service
  mvc:
    # Встроенные ошибки Spring MVC (400 невалидный JSON, 404 нет обработчика, 405, 415)
    # отдаются в едином формате RFC 7807 (application/problem+json), как и кастомные —
    # чтобы фронт (api.ts handle: problem.detail/title) единообразно показывал их пользователю.
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/waybill}
    username: ${DB_USER:epd}
    password: ${DB_PASSWORD:epd_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # БД развёрнутого стенда может опережать этот checkout на служебные миграции,
    # отсутствующие в коде (V10 waybill_request_one_pending). Их отсутствие в
    # classpath — future/missing — не должно останавливать старт.
    ignore-migration-patterns: "*:missing,*:future"
  servlet:
    multipart:
      # Вложения к ПЛ (CMR / накладные / фото груза) — скан-копии до ~12 МБ.
      max-file-size: 15MB
      max-request-size: 16MB
  thymeleaf:
    # Встроенные шаблоны бланков — ПОСЛЕ резолвера переопределений из БД (DbTemplateResolver, порядок 1):
    # отредактированный администратором шаблон (MIGRATION.md 7.1) имеет приоритет над classpath.
    template-resolver-order: 10
epd:
  # Публичный адрес веб-кабинета — в него ведёт ссылка QR-кода печатного бланка ПЛ
  # ({base}/verify/{jws}, страница офлайн-проверки инспектором).
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  master-data:
    base-url: ${MASTER_DATA_URL:http://localhost:8081}
  service-account:
    # Сервисный client-credentials токен для межсервисных вызовов master-data без
    # пользовательского токена (агрегатор ЧУРА/НЕРУ, планировщик). Клиент epd-aggregator
    # (роль API_INTEGRATOR). Секрет в проде заменить/вынести в Vault!
    token-uri: ${SERVICE_TOKEN_URI:http://localhost:8180/realms/epd/protocol/openid-connect/token}
    client-id: ${SERVICE_CLIENT_ID:epd-aggregator}
    client-secret: ${SERVICE_CLIENT_SECRET:epd_aggregator_dev_secret}
  payment:
    # Оплата ПЛ (AWAITING_PAYMENT → PAID). Выключена в dev; агрегаторские ПЛ
    # (source=AGGREGATOR) покрыты абонементом и не тарифицируются в любом случае.
    enabled: ${PAYMENT_ENABLED:false}
    fee-somoni: ${PAYMENT_FEE:10.00}
    # Секрет webhook платёжного шлюза (X-Payment-Secret). В проде заменить!
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev_webhook_secret}
  events:
    # Kafka-topic статусных событий ПЛ — читают единый кабинет, аналитика, антифрод
    topic: ${EVENTS_TOPIC:epd.waybill.status}
  security:
    # Проверка JWT (split-horizon Keycloak): ключи тянутся по ВНУТРЕННЕМУ адресу
    # (docker-сеть), claim iss сверяется с ВНЕШНИМ issuer'ом (realm frontendUrl).
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8180/realms/epd/protocol/openid-connect/certs}
    expected-issuer: ${KEYCLOAK_EXPECTED_ISSUER:http://localhost:8180/realms/epd}
    # Legacy-агрегаторы (ЧУРА/НЕРУ): по умолчанию ЗАКРЫТ (fail-closed) — нужен
    # client-credentials токен клиента epd-aggregator (роль API_INTEGRATOR). Для локального
    # запуска без Keycloak/compose явно задайте AGGREGATOR_OPEN=true.
    aggregator-open: ${AGGREGATOR_OPEN:false}
    # OpenAPI/Swagger UI: dev открыт, прод (DOCS_OPEN=false) — под аутентификацией.
    docs-open: ${DOCS_OPEN:true}
    # Проверка audience JWT: пусто (dev) — только issuer+exp; задан (напр. epd-waybill) —
    # токен обязан нести этот aud (нужен audience-mapper в Keycloak). Защита от приёма
    # токена, выпущенного для другого клиента/цели того же realm.
    required-audience: ${REQUIRED_AUDIENCE:}
  signing:
    # Подпись титулов ПЛ. stub (dev) — SHA-256 хеш содержимого (НЕ юридически значима);
    # cades (prod) — квалифицированная ЭП через Crypto Service УЦ РТ (Закон РТ № 1965) +
    # метка доверенного времени TSP. Переключается без изменения кода (TitleSigner).
    mode: ${SIGNING_MODE:stub}
    crypto-url: ${SIGNING_CRYPTO_URL:http://localhost:9099}
  qr:
    # Ключ подписи QR (JWS ES256, якорь офлайн-проверки инспектором). Пусто в dev —
    # эфемерный ключ при старте. В проде задать СТАБИЛЬНЫЙ приватный EC JWK (Vault/HSM),
    # общий для всех реплик, иначе рестарт/масштабирование ломают проверку. При
    # epd.signing.mode!=stub пустой ключ запрещён (fail-fast на старте).
    signing-key: ${QR_SIGNING_KEY:}
  calc:
    # Надбавка на отопление салона (brands.fuel_interior_heating × часы работы) в пассажирском
    # расчёте обычной (не душанбинской) ветки. OFF — не применять (в legacy warm_salon всегда 0 —
    # паритет чисел); WINTER — только при действующем зимнем коэффициенте маршрута (замысел
    # оригинала); ALWAYS — круглый год. См. MIGRATION.md 5.3 / Вопрос 19.
    interior-heating: ${CALC_INTERIOR_HEATING:OFF}
    # Посуточный расчёт многодневных пассажирских ПЛ 1-А/3-С (MIGRATION.md 5.4, B10): показатели перевозки
    # по дням (MultiDayPassengerCalc) и посуточный расход топлива по строкам топлива, привязанным к рабочим
    # дням (DailyFuelCalc — перенос MBusTrait::calcFuel). Включён по решению владельца 22.09; false — прежнее
    # однодневное приближение.
    multiday-passenger: ${MULTIDAY_PASSENGER_ENABLED:true}
  limits:
    # Лимит суточного пробега (650 км для 3-С и 1-А — legacy max_counter_value). В оригинале это скрытое поле
    # формы и тексты сообщений без действующих правил (фактически не проверялось), поэтому по умолчанию
    # выключено; true — проверять рабочий день (одометр въезда − выезда) и возврат однодневного ПЛ.
    # См. MIGRATION.md 12.5 / Вопрос 20.
    daily-km-enabled: ${LIMITS_DAILY_KM_ENABLED:false}
  gps:
    # GPS-события Smart-city (MIGRATION.md 9.7 / 12.12 — legacy gps_data): повтор того же состояния (для
    # маршрутных — того же направления) и выезд с маршрута после въезда — не раньше, чем через N минут (legacy 20).
    event-cooldown-minutes: ${GPS_EVENT_COOLDOWN_MINUTES:20}
    # Виды ПЛ, к которым привязывается событие (ПЛ дня по госномеру). Legacy — только Waybill1ad (Т 1-АД);
    # троллейбус — та же форма. Через запятую, например WB_BUS,WB_TROLLEYBUS,WB_MINIBUS.
    event-waybill-types: ${GPS_EVENT_WAYBILL_TYPES:WB_BUS,WB_TROLLEYBUS}
  meddata:
    # Ключ шифрования медицинских показателей (AES-256-GCM, ИБ-13.1.3) — 256 бит, Base64.
    # Обязателен всегда (нет dev-заглушки — см. MedicalDataCrypto): отсутствие шифрования
    # особой категории ПДн не приемлемо ни в какой среде, включая локальный стенд.
    encryption-key: ${MEDDATA_ENCRYPTION_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
