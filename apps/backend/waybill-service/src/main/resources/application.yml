server:
  port: 8082

spring:
  application:
    name: waybill-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/waybill}
    username: ${DB_USER:epd}
    password: ${DB_PASSWORD:epd_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/epd}

epd:
  master-data:
    base-url: ${MASTER_DATA_URL:http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
