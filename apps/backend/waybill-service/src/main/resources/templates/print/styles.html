<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Общие стили печатных бланков ПЛ (перенос rohkhat-v2 templates/print/styles.html).
  Подключение: <th:block th:replace="~{print/styles :: styles}"/>
  Формат листа и поля заданы здесь, а не в браузере: бланк — документ утверждённой
  формы (Замима 7 к Қоидаи нақлиёти автомобилӣ) и его вид не зависит от того, кто печатает.
-->
<body>
<th:block th:fragment="styles">
    <style>
        @page { size: A4 landscape; margin: 8mm; }
        * { font-family: "DejaVu Sans", sans-serif; }
        body { font-size: 7.5pt; line-height: 1.15; color: #000; margin: 0; }
        table { width: 100%; border-collapse: collapse; }
        td, th { vertical-align: top; padding: 1px 3px; }
        table.bordered td, table.bordered th { border: 0.5pt solid #000; }
        table.bordered th { font-weight: bold; text-align: center; }
        .line { border-bottom: 0.5pt solid #000; min-height: 9pt; }
        .title { text-align: center; font-weight: bold; font-size: 11pt; }
        .subtitle { text-align: center; font-size: 8pt; }
        .form-reference { text-align: right; font-size: 6pt; line-height: 1.2; }
        .caption { font-size: 6pt; text-align: center; color: #333; }
        .right { text-align: right; }
        .center { text-align: center; }
        .bold { font-weight: bold; }
        .nowrap { white-space: nowrap; }
        .section { margin-top: 2.6mm; }
        .page-break { page-break-after: always; }
        .qr { width: 78px; height: 78px; }
        .badge { display: inline-block; border: 0.5pt solid #0a6b3b; color: #0a6b3b; border-radius: 3px; padding: 0 4px; font-size: 6pt; }
        /* Отметка «Копия» (QA §17) — печать не первая. Обычный блок в потоке документа
           (не position:fixed/overlay) — гарантированно не перекрывает контент бланка,
           в отличие от штампа поверх шапки, которая у разных форм разной высоты. */
        .copy-stamp { background: #b91c1c; color: #fff; font-weight: bold; font-size: 10pt;
            text-align: center; padding: 1.5mm; margin-bottom: 2mm; letter-spacing: 2px; }
        /* Водяной знак (Б4, не-ЭЦП часть): полупрозрачная надпись по диагонали поверх бланка.
           position:fixed — openhtmltopdf повторяет её на КАЖДОЙ странице PDF; светлый rgba и
           z-index под контентом гарантируют, что знак не мешает читать/печатать документ.
           Печатается только при включённой настройке show_watermark и непустом watermark_text. */
        .wm-mark { position: fixed; top: 42%; left: 0; width: 100%; text-align: center;
            transform: rotate(-30deg); transform-origin: center; font-size: 54pt; font-weight: bold;
            color: rgba(0, 0, 0, 0.07); letter-spacing: 8px; white-space: nowrap; z-index: 0; }
        /* Отметка о формировании бланка (Б4): «Сформировано: дата и время». */
        .print-footer { margin-top: 3mm; font-size: 6pt; color: #555; text-align: left; }
    </style>
</th:block>
</body>
</html>
