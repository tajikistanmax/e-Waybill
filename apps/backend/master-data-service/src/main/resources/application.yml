server:
  port: 8081

spring:
  application:
    name: master-data-service
  datasource:
    url: jdbc:postgresql://localhost:5442/masterdata
    username: epd
    password: epd_dev_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/epd

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
