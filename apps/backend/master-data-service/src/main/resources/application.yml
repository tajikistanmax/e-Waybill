server:
  port: 8081

spring:
  application:
    name: master-data-service
  mvc:
    # Встроенные ошибки Spring MVC (400 невалидный JSON, 404 нет обработчика, 405, 415)
    # отдаются в едином формате RFC 7807 (application/problem+json), как и кастомные —
    # чтобы фронт (api.ts handle: problem.detail/title) единообразно показывал их пользователю.
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/masterdata}
    username: ${DB_USER:epd}
    password: ${DB_PASSWORD:epd_dev_password}
  data:
    # Redis для кэша справочников/политик (Spring Cache). В compose хост = redis
    # (SPRING_DATA_REDIS_HOST), локально — localhost. Подключение ленивое: недоступность
    # Redis не мешает старту, чтение падает в БД (см. CacheConfig).
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # БД развёрнутого стенда может опережать этот checkout на служебные миграции,
    # отсутствующие в коде (напр. V26 waybill_status_names). Их отсутствие в
    # classpath не должно останавливать применение новых миграций порта «Роҳхат».
    ignore-migration-patterns: "*:missing,*:future"
  servlet:
    multipart:
      # Скан-копии учредительных документов организации (PDF/изображения) — до ~12 МБ
      # (OrganizationDocumentController). Логотип/фон входа заведомо меньше.
      max-file-size: 15MB
      max-request-size: 16MB
epd:
  unified-platform:
    # stub — dev-имитация налоговой/ГАИ; http — реальная единая платформа Минтранса
    mode: ${UNIFIED_PLATFORM_MODE:stub}
    base-url: ${UNIFIED_PLATFORM_URL:http://localhost:8090}
  security:
    # OpenAPI/Swagger UI: dev открыт, прод (DOCS_OPEN=false) — под аутентификацией.
    docs-open: ${DOCS_OPEN:true}
  auth:
    # Аутентификация платформы (с 23.09.2026, вместо Keycloak): служба сама выпускает и
    # проверяет токены, учётные записи лежат в таблице app_user.
    #
    # issuer — значение claim `iss`; служба путевых листов сверяет его с AUTH_ISSUER и
    # берёт ключи подписи с /api/v1/auth/jwks. Значения обязаны совпадать.
    issuer: ${AUTH_ISSUER:http://master-data:8081/api/v1/auth}
    # Срок жизни токена доступа и сессии (токена обновления), секунды.
    access-ttl-seconds: ${AUTH_ACCESS_TTL:1800}
    refresh-ttl-seconds: ${AUTH_REFRESH_TTL:43200}
    # Защита от подбора пароля: после N неудач вход блокируется на M минут.
    max-failed-attempts: ${AUTH_MAX_FAILED:10}
    lock-minutes: ${AUTH_LOCK_MINUTES:15}
    bootstrap:
      # Разовый перенос учётных записей из экспорта Keycloak при первом запуске с пустой
      # таблицей. Путь пуст — перенос не выполняется (чистая установка).
      enabled: ${AUTH_BOOTSTRAP_ENABLED:true}
      realm-file: ${AUTH_BOOTSTRAP_REALM_FILE:}
      # Начальный администратор платформы для установки с нуля. Пароль — только из
      # окружения, в репозитории не хранится; меняется при первом входе.
      admin-username: ${EPD_AUTH_ADMIN_USERNAME:}
      admin-password: ${EPD_AUTH_ADMIN_PASSWORD:}
      # Служебная учётная запись межсервисных вызовов (роль API_INTEGRATOR): ею входит
      # служба путевых листов, когда пользовательского токена нет.
      service-username: ${SERVICE_ACCOUNT_USERNAME:}
      service-password: ${SERVICE_ACCOUNT_PASSWORD:}
      # Учётная запись внешнего агрегатора (канал /api/v1/aggregator, роль API_INTEGRATOR),
      # замена client-credentials клиента Keycloak epd-aggregator. Без пароля не создаётся.
      aggregator-username: ${AGGREGATOR_USERNAME:epd-aggregator}
      aggregator-password: ${AGGREGATOR_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
