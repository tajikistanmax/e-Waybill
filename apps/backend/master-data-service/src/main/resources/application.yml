server:
  port: 8081

spring:
  application:
    name: master-data-service
  mvc:
    # Встроенные ошибки Spring MVC (400 невалидный JSON, 404 нет обработчика, 405, 415)
    # отдаются в едином формате RFC 7807 (application/problem+json), как и кастомные —
    # чтобы фронт (api.ts handle: problem.detail/title) единообразно показывал их пользователю.
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/masterdata}
    username: ${DB_USER:epd}
    password: ${DB_PASSWORD:epd_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # Изображения бренда (логотип/фон входа) — заведомо меньше; предел совпадает с BrandingController.
      max-file-size: 3MB
      max-request-size: 3MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/epd}

epd:
  unified-platform:
    # stub — dev-имитация налоговой/ГАИ; http — реальная единая платформа Минтранса
    mode: ${UNIFIED_PLATFORM_MODE:stub}
    base-url: ${UNIFIED_PLATFORM_URL:http://localhost:8090}
  security:
    # OpenAPI/Swagger UI: dev открыт, прод (DOCS_OPEN=false) — под аутентификацией.
    docs-open: ${DOCS_OPEN:true}
    # Проверка audience JWT: пусто (dev) — только issuer+exp; задан (напр. epd-master-data) —
    # токен обязан нести этот aud (нужен audience-mapper в Keycloak).
    required-audience: ${REQUIRED_AUDIENCE:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
