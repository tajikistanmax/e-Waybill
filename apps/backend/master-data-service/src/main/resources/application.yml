server:
  port: 8081

spring:
  application:
    name: master-data-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/masterdata}
    username: ${DB_USER:epd}
    password: ${DB_PASSWORD:epd_dev_password}
  data:
    # Redis для кэша справочников/политик (Spring Cache). В compose хост = redis
    # (SPRING_DATA_REDIS_HOST), локально — localhost. Подключение ленивое: недоступность
    # Redis не мешает старту, чтение падает в БД (см. CacheConfig).
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # БД развёрнутого стенда может опережать этот checkout на служебные миграции,
    # отсутствующие в коде (напр. V26 waybill_status_names). Их отсутствие в
    # classpath не должно останавливать применение новых миграций порта «Роҳхат».
    ignore-migration-patterns: "*:missing,*:future"
  servlet:
    multipart:
      # Скан-копии учредительных документов организации (PDF/изображения) — до ~12 МБ
      # (OrganizationDocumentController). Логотип/фон входа заведомо меньше.
      max-file-size: 15MB
      max-request-size: 16MB
epd:
  unified-platform:
    # stub — dev-имитация налоговой/ГАИ; http — реальная единая платформа Минтранса
    mode: ${UNIFIED_PLATFORM_MODE:stub}
    base-url: ${UNIFIED_PLATFORM_URL:http://localhost:8090}
  security:
    # Проверка JWT (split-horizon Keycloak): ключи тянутся по ВНУТРЕННЕМУ адресу
    # (docker-сеть), claim iss сверяется с ВНЕШНИМ issuer'ом (realm frontendUrl).
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8180/realms/epd/protocol/openid-connect/certs}
    expected-issuer: ${KEYCLOAK_EXPECTED_ISSUER:http://localhost:8180/realms/epd}
    # OpenAPI/Swagger UI: dev открыт, прод (DOCS_OPEN=false) — под аутентификацией.
    docs-open: ${DOCS_OPEN:true}
    # Проверка audience JWT: пусто (dev) — только issuer+exp; задан (напр. epd-master-data) —
    # токен обязан нести этот aud (нужен audience-mapper в Keycloak).
    required-audience: ${REQUIRED_AUDIENCE:}
  keycloak:
    # Admin API для провижининга логинов сотрудников перевозчика (OrgUserController).
    # base-url — ВНУТРЕННИЙ адрес Keycloak (docker-сеть); realm — epd; client — service account
    # epd-provisioner (realm-management: manage-users). enabled=false → провижининг отдаёт 503.
    enabled: ${KEYCLOAK_ADMIN_ENABLED:true}
    base-url: ${KEYCLOAK_BASE_URL:http://keycloak:8180}
    realm: ${KEYCLOAK_REALM:epd}
    client-id: ${KEYCLOAK_PROVISIONER_CLIENT_ID:epd-provisioner}
    client-secret: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET:epd_provisioner_dev_secret}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
