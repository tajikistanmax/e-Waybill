# Интеграции платформы ЭПД РТ (20 направлений из бизнес-логики заказчика + уточнения исследования)

integrations:
  - code: UNIFIED_PLATFORM
    name: "Единая платформа Минтранса (мастер-данные)"
    what: "реестры ЮЛ/ИП, водителей, ТС, лицензий, сертификатов, контрольных карточек, международных разрешений, история перевозок"
    mode: "REST/gRPC + события изменений (Kafka); принцип однократности — данные не копируются, снимок фиксируется в момент выдачи ПЛ"
    critical: true
  - code: SSO_IAM
    name: "SSO / IAM (Keycloak)"
    what: "единая аутентификация всех кабинетов, роли, 2FA, OAuth2/OIDC"
    critical: true
  - code: LICENSE_REGISTRY
    name: "Реестр лицензий (Госслужба, transcontrol.tj)"
    what: "проверка активной лицензии на вид перевозки"
  - code: CONTROL_CARD
    name: "Контрольные карточки ТС (варақаи назоратӣ)"
    what: "действительность карточки для перевозчиков общего пользования"
  - code: CERT_REGISTRY
    name: "Сертификаты (соответствия, компетентности)"
    what: "проверка сертификатов организации/водителя"
  - code: E_PERMIT
    name: "E-PERMIT (электронные дозволы)"
    what: "валидация дозвола для международного ПЛ; общий централизованный биллинг"
    critical: true
  - code: E_CMR
    name: "eCMR"
    what: "привязка международного ПЛ/э-ТТН к электронной накладной КДПГ (РТ — участник протокола с 2019)"
  - code: E_TIR
    name: "eTIR"
    what: "обмен данными транзита с национальным приложением eTIR (первые операции 05.2026)"
  - code: GPS_MONITORING
    name: "GPS/ГЛОНАСС-мониторинг"
    what: "трек рейса, контроль маршрута/пробега, сверка одометра"
  - code: NERU_CAMERAS
    name: "NERU / дорожные камеры"
    what: "пассивная сверка госномера с наличием активного ПЛ (модель RFID/FASTag Индии); антифрод"
  - code: TAX_COMMITTEE
    name: "Налоговый комитет"
    what: "проверка РМА, статуса ЮЛ/ИП, кадровой принадлежности водителя; передача данных для контроля"
  - code: MVD_GAI
    name: "МВД / ГАИ"
    what: "валидация ТС (учёт, розыск) и ВУ (действительность, категории, лишение)"
  - code: PAYMENT_GATEWAY
    name: "Платёжный шлюз («Корти милли», банки, кошельки)"
    what: "оплата тарифов за выдачу документов; через биллинг E-PERMIT"
    critical: true
  - code: NOTIFICATIONS
    name: "SMS / Email / Push"
    what: "уведомления участникам (номер ПЛ водителю — SMS-резерв при отсутствии интернета)"
  - code: DIGITAL_SIGNATURE
    name: "ЭЦП (национальный УЦ РТ, Закон № 1965)"
    what: "квалифицированная ЭП титулов (облачная подпись/токены), метки времени"
    critical: true
  - code: QR_VERIFY
    name: "Сервис QR-проверки"
    what: "публичный высокодоступный сервис верификации; офлайн — подписанная нагрузка (JWS/COSE), JWKS-дистрибуция ключей"
    critical: true
  - code: MED_REGISTRY
    name: "Реестр медработников (Минздрав)"
    what: "аккредитация медработников и медпунктов; поверенные приборы (алкотестеры, тонометры)"
  - code: STATISTICS
    name: "Агентство по статистике"
    what: "государственная статистическая отчётность (формы по перевозкам — замена бумажной Замимаи 7)"
  - code: CUSTOMS
    name: "Таможенная служба"
    what: "данные международных рейсов на пункты пропуска (связка с eTIR/E-PERMIT)"
  - code: AGGREGATORS
    name: "API агрегаторов (ЧУРА, НЕРУ и др.)"
    what: "выпуск ПЛ такси по API: заявка → медосмотр/техосмотр → выдача; legacy-совместимый контракт waybill_neru"

principles:
  - "Каждая интеграция: инициатор, протокол, формат, режим (онлайн/батч), SLA, деградация при недоступности"
  - "Изоляция в Integration Gateway: сбой внешней системы не блокирует ядро (кэш последних валидных ответов, очереди повторов)"
  - "Форматы данных перевозочных документов — профиль UN/CEFACT MMT-RDM (XML/JSON)"
  - "Обмен система-система для международного контура — AS4/eDelivery"
