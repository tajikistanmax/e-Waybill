# Типы путевых листов платформы ЭПД РТ
# Модель: тип ПЛ (вид ТС/перевозки) × режим действия × вид сообщения.
# Legacy-маппинг — формы действующей системы rohkhat.tj / программы НА ва ХЛ.

meta:
  # Вид сообщения (намуди ҳамлу нақл) — атрибут любого ПЛ
  communication_types:
    - { code: URBAN, tj: "шаҳрӣ", ru: "городское" }
    - { code: SUBURBAN, tj: "наздишаҳрӣ", ru: "пригородное" }
    - { code: INTERCITY, tj: "байнишаҳрӣ", ru: "междугородное" }
    - { code: INTERNATIONAL, tj: "байналмилалӣ", ru: "международное" }
  # Режим действия
  validity_modes:
    - { code: SINGLE_TRIP, ru: "разовый (1 рейс / 1 гардиш)" }
    - { code: DAILY, ru: "суточный (1 день)" }
    - { code: MULTI_DAY, ru: "многодневный (рабочие дни в пределах срока)" }
    - { code: SHIFT, ru: "сменный (2 водителя на одном ТС)" }

types:
  - code: WB_CAR
    name_ru: "Путевой лист легкового автомобиля"
    name_tj: "Роҳхати автомобили сабукрав"
    legacy_form: "3-С (waybill3c)"
    validity: "до 7 дней (такси г. Душанбе — до 1 месяца)"
    max_odometer_per_period: 2800
    service_kinds: [ "фармоишӣ/такси", "хатсайр/маршрут", "соатбайъ/почасовой" ]
    specifics:
      - "type_service определяет активные поля: маршрут+график (хатсайр) либо территория деятельности (такси, почасовой)"
      - "work_days — до 7 записей"
      - "топливо: до 2 видов"

  - code: WB_TAXI
    name_ru: "Путевой лист такси"
    name_tj: "Роҳхати таксӣ"
    legacy_form: "3-С, type_service=1 (+ API агрегаторов waybill_neru)"
    validity: "до 7 дней; Душанбе — до 1 месяца"
    specifics:
      - "оформляется в т.ч. через API агрегаторов (ЧУРА, НЕРУ): новый запрос закрывает предыдущий активный ПЛ"
      - "правило: entry_date − exit_date ≤ 7 дней"
      - "территория деятельности (regions_id)"

  - code: WB_MINIBUS
    name_ru: "Путевой лист микроавтобуса"
    name_tj: "Роҳхати микроавтобус"
    legacy_form: "1-А (waybill1a)"
    validity: "до 4 дней (legacy manual) / до 7 дней (уточнить у заказчика)"
    max_odometer_per_period: 650
    specifics:
      - "work_days с ежедневными begin_path, кругами, одометром, топливом (до 2 видов)"
      - "касса (хазина)"

  - code: WB_BUS
    name_ru: "Путевой лист автобуса"
    name_tj: "Роҳхати автобус"
    legacy_form: "Т (1-АД) (waybill1ad)"
    validity: "1 день"
    specifics:
      - "маршрут, график (реҷа), круги, выручка, время работы кондиционера"
      - "одометр недоступен диспетчеру для правки (авто из предыдущего ПЛ)"
      - "обязательный послерейсовый медосмотр (пассажирская перевозка)"
      - "топливо: до 2 видов, вносится один раз"

  - code: WB_TROLLEYBUS
    name_ru: "Путевой лист троллейбуса"
    name_tj: "Роҳхати троллейбус"
    legacy_form: "Т (1-АД) троллейбус (waybill1ade/1adt)"
    validity: "1 день"
    specifics:
      - "как автобус, но без топлива и клиента (электротранспорт)"

  - code: WB_TRUCK
    name_ru: "Путевой лист грузового автомобиля"
    name_tj: "Роҳхати автомобили боркаш"
    legacy_form: "2-Б (waybill2b)"
    validity: "до 15 дней (API) / до 7 дней (manual) — нормализовать"
    specifics:
      - "вид перевозки: корбайъ (сдельная) / соатбайъ (почасовая)"
      - "направление (самт), клиент, до 2 прицепов (ядак)"
      - "work_days до 15; топливо 1 запись/день"
      - "связь с накладными: борхати замимаи 1/2 → э-ТТН (этап 2)"

  - code: WB_TRUCK_INTL
    name_ru: "Путевой лист международной грузовой перевозки"
    name_tj: "Роҳхати боркашонии байналмилалӣ"
    legacy_form: "5Б-БМ (waybill5bbm)"
    validity: "1 рейс (гардиш)"
    specifics:
      - "два водителя (first/second driver)"
      - "виза: срок, страна выдачи"
      - "маршрут: страна/город погрузки и разгрузки, транзитные страны"
      - "груз: наименование, объём, расстояние с грузом"
      - "книжка ББА/TIR (bba_number)"
      - "привязки: дозвол E-PERMIT (обязательно), eCMR, eTIR"
      - "двуязычное представление (тадж./англ. или рус./англ.)"

  - code: WB_PAX_INTL
    name_ru: "Путевой лист международной пассажирской перевозки"
    name_tj: "Роҳхати мусофирбарии байналмилалӣ"
    legacy_form: "4М-БМ (в legacy без API — описать полноценно)"
    validity: "1 рейс (гардиш)"
    specifics:
      - "как WB_TRUCK_INTL, но пассажирский: список пассажиров/рейсовое задание вместо груза"
      - "обязательные пред- и послерейсовые медосмотры"
      - "привязка к дозволу E-PERMIT"

  - code: WB_SPECIAL
    name_ru: "Путевой лист специальной техники"
    name_tj: "Роҳхати техникаи махсус"
    legacy_form: "— (новый тип)"
    validity: "до 7 дней"
    specifics:
      - "вид спецработ, моточасы, время работы оборудования (work_time)"

  - code: WB_DANGEROUS
    name_ru: "Путевой лист перевозки опасных грузов"
    name_tj: "Роҳхати ҳамли борҳои хатарнок"
    legacy_form: "— (новый тип; Правила перевозки опасных грузов РТ)"
    validity: "1 рейс"
    specifics:
      - "класс опасности груза (ADR), свидетельство о допуске ТС и водителя"
      - "обязательный послерейсовый медосмотр"
      - "маршрут согласования (при необходимости)"

# Атрибуты-надстройки (из бизнес-логики заказчика 10.07.2026) — реализуются
# флагами/связями любого типа, а не отдельными типами:
attributes:
  - { flag: shift_mode, ru: "сменный ПЛ — 2 водителя на одном ТС, блоки Т2/Т6 на каждого" }
  - { flag: single_use, ru: "разовый ПЛ" }
  - { flag: multi_day, ru: "многоразовый/многодневный ПЛ (work_days)" }
  - { flag: ecmr_link, ru: "привязка к e-CMR (id накладной)" }
  - { flag: ettn_link, ru: "привязка к э-ТТН (этап 2)" }
  - { flag: gps_control, ru: "GPS-контроль рейса (интеграция мониторинга)" }
