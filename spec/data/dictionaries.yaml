# Справочники (НСИ) платформы ЭПД РТ
# Источники: legacy rohkhat.tj + программа НА ва ХЛ (МД-Дастурамал) + бизнес-логика заказчика.
# master: UP = единая платформа Минтранса, LOCAL = платформа ЭПД, EXT = внешняя система.

dictionaries:
  # Организационные (мастер-данные)
  - { code: companies,        ru: "Организации (корхонаҳо)",            master: UP,    note: "ЮЛ/ИП; РМА — ключ; тип: общего пользования/ведомственный" }
  - { code: drivers,          ru: "Водители (ронандаҳо)",               master: UP,    note: "РМА, ВУ, категории, класс (дараҷа), медсправка, 20-часовые занятия" }
  - { code: vehicles,         ru: "Транспортные средства",              master: UP,    note: "госномер — ключ; тип, марка, VIN, техосмотр, контрольная карточка, прицепы" }
  - { code: employees,        ru: "Сотрудники (врач/механик/диспетчер)", master: UP,   note: "тип 1/2/3, ЭП, печать (муҳр)" }
  - { code: med_points,       ru: "Медпункты-аутсорсеры",               master: LOCAL, note: "аккредитация, медработники, приборы с поверкой" }
  - { code: tech_points,      ru: "СТО/техпункты-аутсорсеры",           master: LOCAL, note: "аккредитация, контролёры" }
  - { code: parkings,         ru: "Стоянки (таваққуфгоҳ)",              master: LOCAL, note: "4 цифры: 1-я — колонна, 3–4-я — бригада (legacy)" }
  # Территориальные
  - { code: regions,          ru: "Регионы РТ (минтақаҳо)",             master: LOCAL, note: "1=Душанбе, 2=ВМКБ, 3=Суғд, 4=Рашт, 5=Хатлон-Бохтар, 6=Хатлон-Кӯлоб, 7=Ҳисор" }
  - { code: cities,           ru: "Города/районы РТ (шаҳрҳо)",          master: LOCAL }
  - { code: countries,        ru: "Государства (давлатҳои хориҷӣ)",     master: LOCAL, note: "ISO 3166 + локальные коды" }
  - { code: foreign_cities,   ru: "Иностранные города",                 master: LOCAL, note: "для погрузки/разгрузки международных рейсов" }
  - { code: border_points,    ru: "Пункты пропуска",                    master: LOCAL, note: "9 действующих; для международных ПЛ" }
  # Транспортные
  - { code: transport_types,  ru: "Типы ТС",                            master: LOCAL, note: "автобус, троллейбус, микроавтобус, легковой, грузовой, спецтехника…" }
  - { code: brands,           ru: "Марки/модели ТС (тамғаҳо)",          master: LOCAL, note: "модель, вместимость, грузоподъёмность, отопление салона л/ч" }
  - { code: fuel_types,       ru: "Виды топлива (сузишворӣ)",           master: LOCAL, note: "1=бензин, 2=дизель, 3=газ сжиженный, 4=газ природный, 5=электро" }
  - { code: routes,           ru: "Маршруты (хатсайрҳо)",               master: LOCAL, note: "номер, название, вид, тип ТС, регион, город/район" }
  - { code: route_types,      ru: "Виды маршрутов",                     master: LOCAL }
  - { code: directions,       ru: "Направления (самтҳо)",               master: LOCAL, note: "для грузовых 2-Б; коэффициенты городской/экспорт/зимний" }
  - { code: schedules,        ru: "Графики (реҷа)",                     master: LOCAL }
  # Документные
  - { code: waybill_types,    ru: "Типы путевых листов",                master: LOCAL, note: "см. waybill-types.yaml" }
  - { code: waybill_statuses, ru: "Статусы путевых листов",             master: LOCAL, note: "см. waybill-statuses.yaml" }
  - { code: cancel_reasons,   ru: "Причины аннулирования",              master: LOCAL, note: "замена ТС, замена водителя, отмена рейса, ошибка оформления…" }
  - { code: reject_reasons_med,  ru: "Причины недопуска (медицинские)", master: LOCAL, note: "давление, алкоголь, состояние…" }
  - { code: reject_reasons_tech, ru: "Причины отклонения ТС",           master: LOCAL, note: "тормоза, рулевое, свет, шины…" }
  - { code: communication_types, ru: "Виды сообщения",                  master: LOCAL, note: "городское/пригородное/междугородное/международное" }
  - { code: service_types,    ru: "Виды услуг легкового ТС",            master: LOCAL, note: "такси/маршрут/почасовой" }
  - { code: shipment_types,   ru: "Виды грузовой перевозки",            master: LOCAL, note: "сдельная (корбайъ)/почасовая (соатбайъ)" }
  - { code: violation_types,  ru: "Виды нарушений (дорожный контроль)", master: LOCAL }
  # Экономические (нормирование и тарифы — наследие НА ва ХЛ)
  - { code: clients,          ru: "Клиенты/заказчики (мизоҷҳо)",        master: LOCAL, note: "номер, вид, название, адрес, телефон" }
  - { code: cargo,            ru: "Грузы (борҳо)",                      master: LOCAL, note: "название, вид, ед. измерения, цена, класс груза; связь с НОМГУЙИ ХИЗМАТРАСОНИҲО" }
  - { code: tariffs,          ru: "Прейскурант (нархнома)",             master: LOCAL, note: "тариф за 1 км: тип ТС × вид маршрута × вид топлива" }
  - { code: coef_winter,      ru: "Коэффициент зимний",                 master: LOCAL, note: "регион, значение, срок с–по (норма расхода топлива)" }
  - { code: coef_city,        ru: "Коэффициент внутригородской",        master: LOCAL }
  - { code: coef_highland,    ru: "Коэффициент высокогорный",           master: LOCAL, note: "актуально для ГБАО/перевалов" }
  - { code: coef_usage,       ru: "Коэффициент эксплуатации (износа)",  master: LOCAL, note: "год выпуска × километраж" }
  - { code: driver_degrees,   ru: "Классы водителей (дараҷаҳо)",        master: LOCAL, note: "класс → % надбавки к оплате (напр., 20%)" }
  - { code: fuel_norms,       ru: "Нормы расхода топлива",              master: LOCAL, note: "марка ТС → базовая норма л/100км; итог = норма × коэффициенты" }
  # Медицинские
  - { code: med_devices,      ru: "Приборы медосмотра (реестр поверки)", master: LOCAL, note: "алкотестеры, тонометры, термометры; срок поверки" }
  - { code: med_norms,        ru: "Нормы медпоказателей",               master: LOCAL, note: "пороги АД/пульса/температуры/алкоголя для автодопуска" }
  # Международные
  - { code: visa_countries,   ru: "Страны выдачи виз",                  master: LOCAL }
  - { code: permit_types,     ru: "Типы дозволов",                      master: EXT,   note: "из E-PERMIT" }
  - { code: dangerous_classes, ru: "Классы опасных грузов (ADR)",       master: LOCAL }

conventions:
  - "Все справочники трёхъязычны: tj (основной), ru, en (международный контур)"
  - "Мастер-данные UP кэшируются локально, снимок значения фиксируется в ПЛ на момент выдачи"
  - "Изменения справочников версионируются (SCD-2), история хранится"
