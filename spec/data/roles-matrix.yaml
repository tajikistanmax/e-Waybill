# Роли пользователей платформы ЭПД РТ и матрица прав
# База — бизнес-логика заказчика (10.07.2026) + аутсорс-сценарий для ИП + мировой опыт.

roles:
  - code: COMPANY_ADMIN
    ru: "Администратор перевозчика (компания/ЮЛ)"
    tj: "Маъмури корхонаи боркашон"
    scope: "своя организация"
    can:
      - "регистрация организации, данные компании (проверка через реестры)"
      - "управление сотрудниками и ролями внутри компании"
      - "просмотр своих ТС и водителей (мастер-данные из единой платформы)"
      - "шаблоны путевых листов компании"
      - "договоры с аутсорс-медпунктами/СТО"
      - "оплата, счета, история, отчёты, скачивание ПЛ"
  - code: DISPATCHER
    ru: "Диспетчер"
    tj: "Танзимгар"
    scope: "своя организация"
    can:
      - "создание ПЛ (выбор ТС, водителя, типа, маршрута, срока)"
      - "подписание Т1"
      - "направление на медосмотр/техосмотр"
      - "фиксация Т4 (одометр/топливо выезд) и Т5 (возврат)"
      - "продление в пределах лимита, закрытие рейса"
      - "отмена/аннулирование до выдачи; после — с подтверждением"
    cannot:
      - "правка одометра автобуса (берётся из предыдущего ПЛ)"
      - "подписание Т2/Т3"
  - code: DOCTOR
    ru: "Медицинский работник"
    tj: "Духтур"
    scope: "своя организация или свой медпункт (аутсорс)"
    can:
      - "лента заявок на осмотр"
      - "предрейсовый осмотр: АД, пульс, температура, алкотест, состояние"
      - "допуск/недопуск с причиной, подписание Т2 (ЭП + печать/муҳр)"
      - "послерейсовый осмотр (Т6)"
      - "электронный журнал медосмотров"
    cannot: [ "видеть чужие медданные, кроме своих записей" ]
  - code: MECHANIC
    ru: "Механик (контролёр техсостояния)"
    tj: "Механик"
    scope: "своя организация или свой техпункт (аутсорс)"
    can:
      - "лента заявок на техконтроль"
      - "проверка ТС: исправно/неисправно, пробег, топливо"
      - "подписание Т3 (ЭП + печать), подтверждение выпуска"
      - "отклонение ТС с актом/фото неисправности"
  - code: DRIVER
    ru: "Водитель"
    tj: "Ронанда"
    scope: "свои документы"
    can:
      - "просмотр активного ПЛ и истории в мобильном кабинете"
      - "подтверждение получения ПЛ (Face ID/PIN) и приёма/сдачи ТС"
      - "предъявление QR-кода инспектору (в т.ч. офлайн)"
      - "отправка завершения рейса, фото/комментарии"
    cannot: [ "подписание титулов ПЛ (модель ГИС ЭПД)" ]
  - code: ACCOUNTANT
    ru: "Бухгалтер"
    tj: "Муҳосиб"
    scope: "своя организация"
    can: [ "счета, подтверждение оплаты, задолженность, финансовые отчёты" ]
  - code: SELF_EMPLOYED
    ru: "Индивидуальный перевозчик (ИП/самозанятый)"
    tj: "Соҳибкори инфиродӣ"
    scope: "свои документы"
    can:
      - "заявка на ПЛ на себя (упрощённый Т1)"
      - "прохождение Т2/Т3 в аккредитованных аутсорс-медпунктах/СТО"
      - "оплата услуг; автоактивация после Т2+Т3"
  - code: MED_ORG_ADMIN
    ru: "Администратор медорганизации-аутсорсера"
    tj: "Маъмури муассисаи тиббӣ"
    scope: "свой медпункт"
    can: [ "ведение своих медработников, приём заявок ИП и компаний-клиентов, счета через биллинг" ]
  - code: TECH_ORG_ADMIN
    ru: "Администратор СТО/техпункта-аутсорсера"
    tj: "Маъмури нуқтаи техникӣ"
    scope: "свой техпункт"
    can: [ "ведение контролёров, приём заявок на Т3, счета" ]
  - code: INSPECTOR
    ru: "Инспектор дорожного контроля (Госслужба/ГАИ)"
    tj: "Нозири назорати роҳ"
    scope: "предъявленные документы + свой журнал"
    can:
      - "сканирование QR: офлайн-криптопроверка без логина; онлайн — актуальный статус"
      - "просмотр: статус, водитель, ТС, маршрут (минимизация ПДн)"
      - "фиксация проверки (гео, время) и нарушения"
      - "блокировка документа при нарушении"
  - code: MINTRANS_ANALYST
    ru: "Сотрудник Минтранса (аналитик)"
    tj: "Корманди Вазорати нақлиёт"
    scope: "агрегаты по стране; детально — по запросу с аудитом"
    can: [ "дашборды, отчёты, антифрод-сигналы, госстатистика, выгрузки" ]
  - code: SYSTEM_ADMIN
    ru: "Администратор системы (ГУП ЦЦТО)"
    tj: "Маъмури низом"
    scope: "вся система, полный аудит действий"
    can:
      - "справочники, шаблоны, тарифы"
      - "аккредитация аутсорсеров и API-интеграторов"
      - "управление ролями, ключами QR, интеграциями"
      - "модерация регистраций, разблокировки"
  - code: CALL_OPERATOR
    ru: "Оператор колл-центра (8808)"
    tj: "Оператори маркази занг"
    scope: "ограниченный просмотр по обращению"
    can: [ "поиск по номеру ПЛ/РМА, сброс доступа, регистрация инцидентов" ]
  - code: API_INTEGRATOR
    ru: "Интегратор/агрегатор (API-роль)"
    tj: "Ҳамгироикунанда"
    scope: "объекты своих клиентов (scoped token)"
    can: [ "создание заявок на ПЛ от имени компании-клиента, получение статусов, webhooks" ]
  # Этап 2 (э-ТТН)
  - code: CONSIGNOR
    ru: "Грузоотправитель (этап 2)"
    tj: "Борфиристонанда"
    can: [ "создание э-ТТН, подписание титула отгрузки" ]
  - code: CONSIGNEE
    ru: "Грузополучатель (этап 2)"
    tj: "Борқабулкунанда"
    can: [ "подтверждение/отклонение приёмки груза" ]

signing:
  T1: { signer: DISPATCHER, item: "выпуск ПЛ: рейс, ТС, водитель, маршрут, срок" }
  T2: { signer: DOCTOR, item: "предрейсовый медосмотр" }
  T3: { signer: MECHANIC, item: "предрейсовый техконтроль" }
  T4: { signer: DISPATCHER, item: "одометр/топливо на выезде" }
  T5: { signer: DISPATCHER, item: "одометр на возврате, результаты" }
  T6: { signer: DOCTOR, item: "послерейсовый медосмотр (пассажирские/опасные)" }
  driver_ack: { signer: DRIVER, item: "подтверждение получения ПЛ и приёма/сдачи ТС — простая ЭП (Face ID/PIN)", not_a_title: true }
