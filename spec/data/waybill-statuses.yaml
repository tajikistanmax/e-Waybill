# Статусная модель путевого листа (жизненный цикл)
# База — 18 статусов из бизнес-логики заказчика (10.07.2026), нормализованные
# по титульной модели (Т1–Т6, образец ГИС ЭПД РФ) и legacy-логике rohkhat.tj.

statuses:
  - { code: DRAFT,           ru: "Черновик",                tj: "Лоиҳа",                  desc: "Создаётся диспетчером, редактируем, не подписан" }
  - { code: CREATED,         ru: "Создан (Т1 подписан)",    tj: "Сохта шуд",              desc: "Т1 подписан диспетчером; legacy-статус «Ожидает»" }
  - { code: AWAITING_MED,    ru: "Ожидает медосмотра",      tj: "Дар интизори муоинаи тиббӣ", desc: "Заявка у медработника" }
  - { code: MED_PASSED,      ru: "Медосмотр пройден (Т2)",  tj: "Муоинаи тиббӣ гузашт",   desc: "Врач подписал допуск: АД, пульс, температура, алкотест" }
  - { code: MED_REJECTED,    ru: "Медосмотр отклонён",      tj: "Муоинаи тиббӣ рад шуд",  desc: "Водитель не допущен; замена водителя или аннулирование" }
  - { code: AWAITING_TECH,   ru: "Ожидает техосмотра",      tj: "Дар интизори муоинаи техникӣ", desc: "Заявка у механика (параллельно с медосмотром)" }
  - { code: TECH_PASSED,     ru: "Техосмотр пройден (Т3)",  tj: "Муоинаи техникӣ гузашт", desc: "Механик подписал: ТС исправно, выпуск разрешён" }
  - { code: TECH_REJECTED,   ru: "Техосмотр отклонён",      tj: "Муоинаи техникӣ рад шуд", desc: "ТС неисправно (акт/фото); замена ТС или аннулирование" }
  - { code: AWAITING_PAYMENT, ru: "Ожидает оплаты",         tj: "Дар интизори пардохт",   desc: "Если услуга платная и не покрыта абонементом" }
  - { code: PAID,            ru: "Оплачен",                 tj: "Пардохт шуд",            desc: "Подтверждение платёжного шлюза/бухгалтера" }
  - { code: READY,           ru: "Готов к выдаче",          tj: "Барои додан тайёр",      desc: "Т2+Т3 (+оплата) выполнены; присвоен номер и QR" }
  - { code: ISSUED,          ru: "Выдан",                   tj: "Дода шуд",               desc: "Водитель подтвердил получение (Face ID/PIN) в мобильном кабинете" }
  - { code: ACTIVE,          ru: "Активен (Т4)",            tj: "Фаъол",                  desc: "Одометр/топливо на выезде зафиксированы, ТС на линии; QR действует" }
  - { code: IN_TRIP,         ru: "В рейсе",                 tj: "Дар рейс",               desc: "Подстатус ACTIVE для многодневных/международных (GPS-трек)" }
  - { code: RETURNED,        ru: "Возвращён (Т5)",          tj: "Баргашт",                desc: "Одометр возврата, топливо, круги, выручка внесены" }
  - { code: COMPLETED,       ru: "Завершён (Т6/закрыт)",    tj: "Анҷом ёфт",              desc: "Послерейсовый медосмотр (если требуется) выполнен, ПЛ закрыт" }
  - { code: CANCELLED,       ru: "Аннулирован",             tj: "Бекор шуд",              desc: "С причиной из справочника и ЭП инициатора; ссылка replaced_by" }
  - { code: EXPIRED,         ru: "Просрочен",               tj: "Муҳлаташ гузашт",        desc: "Автоматически: не активирован/не закрыт в срок (+грейс-период)" }
  - { code: BLOCKED,         ru: "Заблокирован инспектором", tj: "Аз ҷониби нозир баста шуд", desc: "Нарушение при дорожном контроле; разблокировка — админ Минтранса" }
  - { code: ARCHIVED,        ru: "В архиве",                tj: "Дар бойгонӣ",            desc: "По сроку ретенции (5+ лет), только чтение" }

transitions:
  - { from: DRAFT,         to: CREATED,        by: "Диспетчер", action: "Подписание Т1 (рейс, ТС, водитель, маршрут, срок)" }
  - { from: DRAFT,         to: CANCELLED,      by: "Диспетчер", action: "Удаление/отмена черновика" }
  - { from: CREATED,       to: AWAITING_MED,   by: "система",   action: "Автоматически: заявка медработнику" }
  - { from: CREATED,       to: AWAITING_TECH,  by: "система",   action: "Автоматически: заявка механику (параллельно)" }
  - { from: AWAITING_MED,  to: MED_PASSED,     by: "Медработник", action: "Подписание Т2 (допуск)" }
  - { from: AWAITING_MED,  to: MED_REJECTED,   by: "Медработник", action: "Отказ в допуске (причина)" }
  - { from: MED_REJECTED,  to: CREATED,        by: "Диспетчер", action: "Замена водителя (корректирующий титул)" }
  - { from: MED_REJECTED,  to: CANCELLED,      by: "Диспетчер", action: "Аннулирование" }
  - { from: AWAITING_TECH, to: TECH_PASSED,    by: "Механик",   action: "Подписание Т3 (исправно)" }
  - { from: AWAITING_TECH, to: TECH_REJECTED,  by: "Механик",   action: "Отказ (дефекты, акт, фото)" }
  - { from: TECH_REJECTED, to: CREATED,        by: "Диспетчер", action: "Замена ТС (корректирующий титул)" }
  - { from: TECH_REJECTED, to: CANCELLED,      by: "Диспетчер", action: "Аннулирование" }
  - { from: "MED_PASSED+TECH_PASSED", to: AWAITING_PAYMENT, by: "система", action: "Если требуется оплата" }
  - { from: "MED_PASSED+TECH_PASSED", to: READY, by: "система", action: "Если оплата не требуется/покрыта: номер + QR" }
  - { from: AWAITING_PAYMENT, to: PAID,        by: "Платёжный шлюз / Бухгалтер", action: "Подтверждение оплаты" }
  - { from: PAID,          to: READY,          by: "система",   action: "Присвоение номера и QR" }
  - { from: READY,         to: ISSUED,         by: "Водитель",  action: "Подтверждение получения (Face ID/PIN)" }
  - { from: ISSUED,        to: ACTIVE,         by: "Диспетчер/система", action: "Т4: одометр и топливо на выезде; выезд на линию" }
  - { from: ACTIVE,        to: RETURNED,       by: "Диспетчер", action: "Т5: одометр возврата, результаты дня/рейса" }
  - { from: ACTIVE,        to: ACTIVE,         by: "Диспетчер", action: "Многодневный: добавление work_day (в пределах срока)" }
  - { from: RETURNED,      to: COMPLETED,      by: "Медработник/система", action: "Т6 послерейсовый медосмотр (пассажирские/опасные), закрытие" }
  - { from: ACTIVE,        to: EXPIRED,        by: "система",   action: "Срок истёк, не закрыт (грейс-период, флаг нарушения)" }
  - { from: READY,         to: EXPIRED,        by: "система",   action: "Не выдан до конца срока действия" }
  - { from: ACTIVE,        to: BLOCKED,        by: "Инспектор", action: "Нарушение при проверке (фиксация, гео, время)" }
  - { from: BLOCKED,       to: ACTIVE,         by: "Админ Минтранса", action: "Разблокировка (с обоснованием, аудит)" }
  - { from: BLOCKED,       to: CANCELLED,      by: "Админ Минтранса", action: "Аннулирование по нарушению" }
  - { from: "любой до COMPLETED", to: CANCELLED, by: "Диспетчер (ACTIVE — с подтверждением)", action: "Аннулирование с причиной; уведомление водителю" }
  - { from: COMPLETED,     to: ARCHIVED,       by: "система",   action: "По политике ретенции" }

invariants:
  - "Один ACTIVE путевой лист на ТС в момент времени"
  - "Один ACTIVE путевой лист на водителя (кроме сменной схемы на том же ТС)"
  - "Подписанные титулы неизменяемы; правки — только корректирующими титулами"
  - "Все переходы — в append-only журнал аудита с ЭП/меткой времени"
  - "Новый ПЛ через API агрегатора закрывает предыдущий активный (legacy-совместимость)"
  - "Многодневный ПЛ: ежедневный медосмотр для пассажирских перевозок; QR-проверка показывает актуальность медосмотра на текущий день"
  - "Замена ТС в рейсе: CANCELLED(причина=замена) + автосоздание нового ПЛ со ссылкой replaces"
