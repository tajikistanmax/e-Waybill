# Блокирующие проверки перед выдачей путевого листа
# База — 14 проверок из бизнес-логики заказчика (10.07.2026) + legacy-правила + мировой опыт (ЕСУТД).

blocking_checks:
  - { id: 1,  check: "Водитель найден в единой базе Минтранса (по РМА)", source: "Единая платформа" }
  - { id: 2,  check: "ТС найдено в единой базе (по госномеру)", source: "Единая платформа / ГАИ" }
  - { id: 3,  check: "Водитель принадлежит организации (или договор/доверенность)", source: "Единая платформа + Налоговый комитет (кадры)" }
  - { id: 4,  check: "ТС принадлежит организации (собственность/аренда/лизинг)", source: "Единая платформа / ГАИ" }
  - { id: 5,  check: "Активная лицензия на вид перевозки (для перевозчиков общего пользования)", source: "Реестр лицензий Госслужбы" }
  - { id: 6,  check: "Контрольная карточка ТС (варақаи назоратӣ) действительна — если обязательна для типа организации", source: "Реестр Госслужбы" }
  - { id: 7,  check: "Водитель не отстранён (нет активного недопуска/лишения ВУ)", source: "Единая платформа / ГАИ" }
  - { id: 8,  check: "ТС не заблокировано (арест, розыск, запрет эксплуатации)", source: "ГАИ / Госслужба" }
  - { id: 9,  check: "Пройден предрейсовый медосмотр (Т2 подписан)", source: "Платформа" }
  - { id: 10, check: "Пройден предрейсовый техконтроль (Т3 подписан)", source: "Платформа" }
  - { id: 11, check: "Нет другого активного ПЛ на это ТС", source: "Платформа (инвариант)" }
  - { id: 12, check: "Нет другого активного ПЛ на этого водителя (кроме сменной схемы)", source: "Платформа (инвариант)" }
  - { id: 13, check: "Услуга оплачена (если тариф платный и не покрыт абонементом)", source: "Биллинг" }
  - { id: 14, check: "Сроки документов не истекли: ВУ, медсправка, техосмотр, техпаспорт, контрольная карточка, 20-часовые занятия", source: "Реестры + платформа" }
  # Дополнительно к списку заказчика:
  - { id: 15, check: "Гостехосмотр ТС действителен (ежегодный)", source: "Реестр техосмотра" }
  - { id: 16, check: "Категория ВУ соответствует типу ТС", source: "ГАИ" }
  - { id: 17, check: "Международный ПЛ: действующий дозвол E-PERMIT на маршрут/страну", source: "E-PERMIT" }
  - { id: 18, check: "Международный ПЛ: срок визы водителя(-ей) покрывает рейс", source: "Платформа (ввод) / МВД" }
  - { id: 19, check: "Опасные грузы: свидетельства о допуске ТС и водителя (ADR)", source: "Госслужба" }
  - { id: 20, check: "Медработник/механик, подписывающие Т2/Т3, аккредитованы и действительны (реестр)", source: "Реестр медработников / аутсорсеров" }

validation_rules:
  - "РМА: только цифры, 9–10 знаков"
  - "Госномер: буквы и цифры (формат РТ)"
  - "entry_date > exit_date; для агрегаторов entry_date − exit_date ≤ 7 дней"
  - "Год выпуска ТС: 4 цифры, 1900 — следующий год"
  - "Одометр возврата ≥ одометра выезда; прирост ≤ лимита типа ПЛ (650/1600/2800 — нормализовать)"
  - "Остаток топлива на выезд = остатку на возврате предыдущего ПЛ того же ТС и вида топлива"
  - "work_days.date в пределах срока действия ПЛ; количество дней ≤ лимита типа"
  - "Прицепы: не более 2; каждый с госномером и маркой"
  - "Топливо: ≤ 2 видов (пассажирские), ≤ 1 записи/день (грузовые)"
  - "Один сотрудник не может подтвердить один ПЛ дважды (409)"
  - "Номер ПЛ: единый национальный формат (серия + номер, проверочный разряд)"

error_model:
  http_400: "ошибка запроса — текст пользователю"
  http_404: "объект не найден (организация/водитель/ТС/ПЛ)"
  http_409: "конфликт: не подтверждён врачом/механиком; повторное подтверждение; активный ПЛ существует"
  http_422: "валидация — ошибки по полям"
  http_500: "внутренняя ошибка"
