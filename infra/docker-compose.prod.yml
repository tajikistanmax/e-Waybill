# Продакшн-подобный стек одного узла — прообраз ЦОД-развёртывания платформы ЭПД РТ.
# Запуск: docker compose -f infra/docker-compose.prod.yml up -d --build
#
# ВНИМАНИЕ: значения секретов ниже — dev-дефолты для локальной проверки.
#           В ПРОДЕ заменить (через .env / docker secrets / vault) все пароли,
#           перевести Keycloak в режим `start` за HTTPS reverse-proxy и задать единый
#           внешний issuer (см. комментарии у сервиса keycloak).
name: epd-rt-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: epd-prod-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-epd}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-epd_dev_password}   # в проде заменить
      POSTGRES_DB: epd
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro      # init: создаёт БД masterdata/waybill
      - pgdata:/var/lib/postgresql/data
    # host-порт НЕ публикуется — БД доступна только внутри сети compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-epd} -d epd"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Резервное копирование БД (перенос legacy Kernel: `db:backup` ежедневно 00:00 + ротация; ИБ-13.8, MIGRATION.md 11.8):
  # pg_dump обеих БД в том `backups` каждый день в BACKUP_TIME (TZ), хранение BACKUP_RETENTION_DAYS, шифрование
  # AES-256 при заданном BACKUP_ENCRYPTION_KEY (infra/.env; тот же ключ, что у scripts/backup-postgres.ps1).
  # Ручной запуск копии: BACKUP_RUN_NOW=1 docker compose ... up -d --force-recreate backup. Восстановление — см. infra/backup/backup-loop.sh.
  backup:
    build:
      context: ./backup
    image: epd/backup:0.1.0
    container_name: epd-prod-backup
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-epd}
      PGPASSWORD: ${DB_PASSWORD:-epd_dev_password}
      TZ: ${TZ:-Asia/Dushanbe}
      BACKUP_TIME: ${BACKUP_TIME:-00:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_RUN_NOW: ${BACKUP_RUN_NOW:-0}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: epd-prod-redis
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: epd-prod-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Только внутренний listener (без EXTERNAL/localhost — наружу Kafka не публикуется).
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: epd-prod-keycloak
    # TODO(prod): заменить `start-dev` на `start` (продакшн-режим Keycloak):
    #   - вынести хранилище в внешнюю БД (KC_DB=postgres, KC_DB_URL=...),
    #   - терминировать HTTPS на reverse-proxy (KC_PROXY_HEADERS=xforwarded, KC_HTTP_ENABLED=true),
    #   - убрать импорт realm из файла в пользу управляемой миграции.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin_dev_password}   # в проде заменить
      KC_HTTP_PORT: 8180
      KC_HEALTH_ENABLED: "true"
      # Токены Keycloak содержат issuer = адрес, с которого их запросили. Браузер ходит на
      # http://localhost:8180 (внешний), а backend-сервисы обращаются на http://keycloak:8180
      # (внутренний). KC_HOSTNAME_STRICT=false разрешает Keycloak отвечать по обоим хостам.
      #
      # ВАЖНО (prod): для сквозной валидации JWT нужен ЕДИНЫЙ внешний issuer, одинаково
      #   резолвящийся и браузером, и сервисами (например, https://auth.epd.tj/realms/epd
      #   через reverse-proxy + KC_HOSTNAME). Тогда KEYCLOAK_ISSUER_URI сервисов и адрес
      #   Keycloak во фронте указывают на один и тот же URL, и issuer в токене совпадает
      #   с ожидаемым сервисами. В этом же compose (localhost vs keycloak) issuer'ы различаются —
      #   это осознанное упрощение dev-подобного стенда.
      KC_HOSTNAME_STRICT: "false"
      # ВНЕШНИЙ адрес Keycloak: он подставляется во все страницы, которые открывает браузер
      # (форма входа, смена временного пароля, настройка второго фактора), и в claim `iss`.
      # Раньше адрес был жёстко записан В САМОМ realm (attributes.frontendUrl), поэтому на
      # любой машине, кроме 10.10.29.70, форма входа отправлялась на недоступный хост: после
      # ввода логина и пароля пользователь оставался на :8180 (находка владельца 23.09.2026).
      # Из realm адрес убран, здесь он задаётся переменной: стенд оставляет своё значение,
      # локальная машина переопределяет его в docker-compose.local.yml.
      # ВАЖНО: значение обязано совпадать с KEYCLOAK_EXPECTED_ISSUER служб (без /realms/epd),
      # иначе API отвечает 401 «The iss claim is not valid».
      KC_HOSTNAME: ${KC_HOSTNAME:-http://10.10.29.70:8180}
    ports:
      - "8180:8180"   # нужен браузеру (фронт редиректит на Keycloak); в проде — через reverse-proxy
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # В образе Keycloak нет curl/wget; проверяем доступность realm через /dev/tcp (bash-фича,
      # /bin/sh на ubi9 — это bash). Успех = realm epd импортирован и отдаёт OIDC-конфигурацию.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8180 && printf 'GET /realms/epd/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q epd"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  minio:
    # Docker Hub больше не раздаёт minio/minio (pull access denied) — берём с quay.io,
    # версия зафиксирована, чтобы пересборка стенда не зависела от «latest».
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: epd-prod-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-epd}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-epd_dev_password}   # в проде заменить
    volumes:
      - miniodata:/data
    restart: unless-stopped

  master-data:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
      args:
        SERVICE: master-data-service
    image: epd/master-data:0.1.0
    container_name: epd-prod-master-data
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/masterdata
      DB_USER: ${DB_USER:-epd}
      DB_PASSWORD: ${DB_PASSWORD:-epd_dev_password}
      # Аутентификация платформы (с 23.09.2026, вместо Keycloak). Издатель токена — эта
      # служба; служба путевых листов сверяет с ним claim iss и берёт ключи подписи.
      AUTH_ISSUER: ${AUTH_ISSUER:-http://master-data:8081/api/v1/auth}
      # Разовый перенос учётных записей из экспорта realm при первом запуске с пустой
      # таблицей. Файл монтируется только для чтения; после перехода его можно убрать.
      AUTH_BOOTSTRAP_REALM_FILE: ${AUTH_BOOTSTRAP_REALM_FILE:-/opt/epd/auth-import/epd-realm.json}
      # Начальный администратор платформы для установки с нуля (когда переносить неоткуда).
      EPD_AUTH_ADMIN_USERNAME: ${EPD_AUTH_ADMIN_USERNAME:-}
      EPD_AUTH_ADMIN_PASSWORD: ${EPD_AUTH_ADMIN_PASSWORD:-}
      # Служебная учётная запись межсервисных вызовов (роль API_INTEGRATOR): ею входит
      # служба путевых листов, когда пользовательского токена нет.
      # Пароль задаётся ТОЛЬКО в infra/.env (в git не попадает). Значения по умолчанию здесь
      # намеренно нет: пароль в репозитории — это выданный секрет.
      # ${VAR:?…} — compose откажется стартовать без пароля (как с MEDDATA_ENCRYPTION_KEY):
      # без него закрытие любого путевого листа падает на переносе одометра (находка 23.09.2026).
      SERVICE_ACCOUNT_USERNAME: ${SERVICE_ACCOUNT_USERNAME:-epd-service}
      SERVICE_ACCOUNT_PASSWORD: ${SERVICE_ACCOUNT_PASSWORD:?SERVICE_ACCOUNT_PASSWORD не задан — добавьте в infra/.env (openssl rand -base64 24)}
      # Учётная запись внешнего агрегатора (канал /api/v1/aggregator при AGGREGATOR_OPEN=false).
      # Агрегатор получает токен POST /api/v1/auth/token этим логином. Необязательна: пустой
      # пароль — запись не создаётся. Пароль — только в infra/.env.
      AGGREGATOR_USERNAME: ${AGGREGATOR_USERNAME:-epd-aggregator}
      AGGREGATOR_PASSWORD: ${AGGREGATOR_PASSWORD:-}
      # Единая платформа Минтранса (субъекты из налоговой, ТС из ГАИ).
      # stub — имитация; при подключении реальной платформы: http + UNIFIED_PLATFORM_URL
      UNIFIED_PLATFORM_MODE: ${UNIFIED_PLATFORM_MODE:-stub}
      UNIFIED_PLATFORM_URL: ${UNIFIED_PLATFORM_URL:-http://unified-platform:8090}
      # Redis для кэша справочников/политик (Spring Cache): внутри сети compose хост = redis.
      # Без этого сервис ищет localhost:6379 → /actuator/health = 503 (Redis health indicator),
      # хотя чтение и падает в БД (CacheConfig). Дефолт application.yml (localhost) — для запуска вне compose.
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      # Ограничение кучи JVM: на небольших узлах (≤6 ГБ RAM) не даём сервису забрать
      # слишком много и уронить соседей/себя в OOM. При переносе на крупный узел — убрать.
      JAVA_TOOL_OPTIONS: ${MD_JAVA_OPTS:--Xmx384m}
    volumes:
      # Источник разового переноса учётных записей (экспорт realm). Только чтение.
      - ./keycloak:/opt/epd/auth-import:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  waybill:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
      args:
        SERVICE: waybill-service
    image: epd/waybill:0.1.0
    container_name: epd-prod-waybill
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/waybill
      DB_USER: ${DB_USER:-epd}
      DB_PASSWORD: ${DB_PASSWORD:-epd_dev_password}
      # Проверка токенов платформы: издатель и ключи подписи — master-data.
      AUTH_ISSUER: ${AUTH_ISSUER:-http://master-data:8081/api/v1/auth}
      AUTH_JWK_SET_URI: ${AUTH_JWK_SET_URI:-http://master-data:8081/api/v1/auth/jwks}
      # Служебная учётная запись для вызовов master-data без пользовательского токена
      # (закрытие ПЛ, НЕРУ/ЧУРА, планировщик). Пароль — только из infra/.env.
      SERVICE_TOKEN_URI: ${SERVICE_TOKEN_URI:-http://master-data:8081/api/v1/auth/token}
      SERVICE_ACCOUNT_USERNAME: ${SERVICE_ACCOUNT_USERNAME:-epd-service}
      SERVICE_ACCOUNT_PASSWORD: ${SERVICE_ACCOUNT_PASSWORD:?SERVICE_ACCOUNT_PASSWORD не задан — добавьте в infra/.env (openssl rand -base64 24)}
      MASTER_DATA_URL: http://master-data:8081
      # Оплата ПЛ включена (AWAITING_PAYMENT → PAID; агрегаторские ПЛ покрыты абонементом)
      PAYMENT_ENABLED: ${PAYMENT_ENABLED:-true}
      PAYMENT_FEE: ${PAYMENT_FEE:-10.00}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-epd_webhook_dev_secret}   # в проде заменить
      # Ключ шифрования медицинских показателей (AES-256-GCM, ИБ-13.1.3). ОБЯЗАТЕЛЕН: без него
      # waybill-service падает на старте (MedicalDataCrypto, fail-fast, dev-заглушки нет).
      # Значение — из infra/.env (сгенерирован один раз; смена ключа делает ранее сохранённые
      # медпоказатели нерасшифровываемыми). ${VAR:?…} — compose откажется стартовать без ключа.
      MEDDATA_ENCRYPTION_KEY: ${MEDDATA_ENCRYPTION_KEY:?MEDDATA_ENCRYPTION_KEY не задан — добавьте в infra/.env (openssl rand -base64 32)}
      # Постоянный ключ подписи QR (JWS ES256) — из infra/.env; пустой допустим только в режиме stub.
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:-}
      # API агрегаторов закрыт: нужен client-credentials токен epd-aggregator (роль API_INTEGRATOR)
      AGGREGATOR_OPEN: ${AGGREGATOR_OPEN:-false}
      # OpenAPI/Swagger UI закрыты (см. тот же комментарий у master-data выше)
      DOCS_OPEN: ${DOCS_OPEN:-false}
      # Статусные события ПЛ → Kafka (внутренний listener) для единого кабинета/аналитики
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Ограничение кучи JVM на небольших узлах (см. master-data). Убрать на крупном узле.
      JAVA_TOOL_OPTIONS: ${WB_JAVA_OPTS:--Xmx384m}
    depends_on:
      postgres:
        condition: service_healthy
      master-data:
        condition: service_started
    restart: unless-stopped

  # Веб-консоль. По умолчанию — единый монолит (все роли, профиль 'all'), поведение до
  # разделения. Профильные сборки (кабинет перевозчика / платформа надзора) — ниже, под
  # opt-in compose-профилем `split` (docker compose --profile split up), чтобы дефолтный
  # запуск и регресс-скрипты не менялись.
  # ВАЖНО: контекст сборки — корень репо (нужен workspace-пакет packages/shared).
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # rewrites Next.js вычисляются на этапе сборки → адреса сервисов передаём как build-arg.
        MD_API_URL: http://master-data:8081
        WB_API_URL: http://waybill:8082
        # Публичный адрес Keycloak для браузера (в проде — внешний https-домен).
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8180}
        # QR-коды ведут на публичный портал проверки (сервис public, браузерный адрес).
        NEXT_PUBLIC_VERIFY_BASE_URL: ${NEXT_PUBLIC_VERIFY_BASE_URL:-http://localhost:3002}
    image: epd/web:0.1.0
    container_name: epd-prod-web
    environment:
      # Дублируем как runtime-env (страховка на случай runtime-вычисления rewrites).
      MD_API_URL: http://master-data:8081
      WB_API_URL: http://waybill:8082
    ports:
      - "80:3000"
      - "3000:3000"   # привычный адрес localhost:3000 (origin разрешён клиентом Keycloak epd-web)
    depends_on:
      - master-data
      - waybill
    restart: unless-stopped

  # Публичный портал проверки ПЛ по QR (интернет, аноним). Единственная функция —
  # /verify/{jws}; обращается только к публичному эндпоинту waybill (/wb-api/.../verify).
  # Отдельное приложение = минимальная поверхность атаки в публичном контуре.
  public:
    build:
      context: ..
      dockerfile: apps/public/Dockerfile
      args:
        WB_API_URL: http://waybill:8082
    image: epd/public:0.1.0
    container_name: epd-prod-public
    ports:
      - "3002:3002"
    depends_on:
      - waybill
    restart: unless-stopped

  # --- Профильные сборки web (opt-in: docker compose --profile split up --build) ---
  # Тот же код web в двух профилях на отдельных хостах/портах. В проде каждый — за своим
  # доменом через reverse-proxy; здесь для наглядности разнесены по портам 3010/3011.
  web-waybill:
    profiles: ["split"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_PROFILE: waybill
        MD_API_URL: http://master-data:8081
        WB_API_URL: http://waybill:8082
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8180}
        NEXT_PUBLIC_VERIFY_BASE_URL: ${NEXT_PUBLIC_VERIFY_BASE_URL:-http://localhost:3002}
        # Ссылка на «соседний» кабинет надзора (экран «Это не ваш кабинет»).
        NEXT_PUBLIC_OVERSIGHT_URL: ${NEXT_PUBLIC_OVERSIGHT_URL:-http://localhost:3011}
    image: epd/web-waybill:0.1.0
    container_name: epd-prod-web-waybill
    environment:
      MD_API_URL: http://master-data:8081
      WB_API_URL: http://waybill:8082
    ports:
      - "3010:3000"
    depends_on:
      - master-data
      - waybill
    restart: unless-stopped

  web-oversight:
    profiles: ["split"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_PROFILE: oversight
        MD_API_URL: http://master-data:8081
        WB_API_URL: http://waybill:8082
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8180}
        NEXT_PUBLIC_VERIFY_BASE_URL: ${NEXT_PUBLIC_VERIFY_BASE_URL:-http://localhost:3002}
        # Ссылка на «соседний» кабинет перевозчика.
        NEXT_PUBLIC_WAYBILL_URL: ${NEXT_PUBLIC_WAYBILL_URL:-http://localhost:3010}
    image: epd/web-oversight:0.1.0
    container_name: epd-prod-web-oversight
    environment:
      MD_API_URL: http://master-data:8081
      WB_API_URL: http://waybill:8082
    ports:
      - "3011:3000"
    depends_on:
      - master-data
      - waybill
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  backups:
