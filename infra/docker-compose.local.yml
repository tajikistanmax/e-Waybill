# Локальный стенд разработчика — ДОПОЛНЕНИЕ к docker-compose.prod.yml.
# Публикует порты бэкендов на хост: регрессионные скрипты (scripts/*.ps1), живые проверки и
# Swagger ходят на localhost:8081 / localhost:8082. На сервере 10.10.29.70 НЕ применять —
# там бэкенды доступны только внутри сети compose (web → master-data:8081 / waybill:8082).
#
# Запуск локального стека:
#   docker compose -p epd-rt-prod -f docker-compose.prod.yml -f docker-compose.local.yml up -d --build
#
# ВНЕШНИЙ АДРЕС KEYCLOAK. Keycloak подставляет его во ВСЕ страницы, которые открывает браузер
# (форма входа, смена временного пароля, настройка второго фактора), и в claim `iss` токена.
# Пока адрес был жёстко записан в realm как http://10.10.29.70:8180, форма входа на локальной
# машине отправлялась на недоступный хост: пользователь вводил логин и пароль и оставался на
# :8180 (находка владельца 23.09.2026). Путь через страницу Keycloak включается для учёток с
# незавершённым действием — временный пароль у КАЖДОГО нового пользователя и обязательный
# второй фактор у привилегированных ролей, то есть ломался вход всем новым пользователям.
#
# Здесь задаём адрес, по которому Keycloak открыт с этой машины, и тот же адрес — в проверке
# `iss` у служб. Значения обязаны совпадать, иначе API отвечает 401 «The iss claim is not valid».
services:
  keycloak:
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8180}
  master-data:
    ports:
      - "8081:8081"
    environment:
      KEYCLOAK_EXPECTED_ISSUER: ${KEYCLOAK_EXPECTED_ISSUER:-http://localhost:8180/realms/epd}
  waybill:
    ports:
      - "8082:8082"
    environment:
      KEYCLOAK_EXPECTED_ISSUER: ${KEYCLOAK_EXPECTED_ISSUER:-http://localhost:8180/realms/epd}
