# Локальный стенд разработчика — ДОПОЛНЕНИЕ к docker-compose.prod.yml.
# Публикует порты служб на хост: регрессионные скрипты (scripts/*.ps1), автотесты Playwright,
# живые проверки и Swagger ходят на localhost:3000 / 3002 / 8081 / 8082 без прокси.
# На сервере 10.10.29.70 НЕ применять — там снаружи открыт только прокси (HTTPS 443 / 8443).
#
# Запуск локального стека:
#   docker compose -p epd-rt-prod -f docker-compose.prod.yml -f docker-compose.local.yml up -d --build
#
# Keycloak из стека убран 24.09.2026 (вход — в самой платформе), поэтому переопределений его
# адреса здесь больше нет.
# SPRING_PROFILES_ACTIVE переопределён на "local" (23.10.2026): docker-compose.prod.yml
# с 23.10.2026 ставит профиль prod по умолчанию, при котором ProdStubGuard требует
# настоящих SIGNING_MODE=cades/UNIFIED_PLATFORM_MODE=http — на локальном стенде
# разработчика их нет и не предполагается (нет доступа к Crypto Service УЦ/единой
# платформе). На боевом сервере 10.10.29.70 этот файл НЕ применяется — там профиль
# остаётся prod, и гвард продолжает жёстко требовать реальные интеграции.
services:
  master-data:
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      # Демо- и QA-учётки из экспорта realm — только на локальном стенде (в prod по умолчанию выкл.).
      AUTH_BOOTSTRAP_REALM_FILE: /opt/epd/auth-import/epd-realm.json
      # RateLimitFilter (ИБ-13.5.3) считает по видимому IP: e2e-тесты (apps/web/e2e/*.spec.ts)
      # ходят сюда НАПРЯМУЮ на localhost:8081 (минуя nginx-прокси и его X-Forwarded-For), поэтому
      # весь трафик полного прогона — десятки спеков, сотни запросов каждой учёткой за несколько
      # минут — виден серверу как один IP и делит один и тот же счётчик по умолчанию (ip-capacity
      # 3000/60с). Найдено 27.10.2026: полный e2e упирался в 429 на admin-automation. На боевом
      # сервере этот файл не применяется — там ip-capacity остаётся дефолтным (3000/60с).
      EPD_RATELIMIT_IP_CAPACITY: "100000"
      EPD_RATELIMIT_GENERAL_CAPACITY: "20000"
  waybill:
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
  web:
    ports:
      - "3000:3000"
  public:
    ports:
      - "3002:3002"
  proxy:
    environment:
      # Полный прогон e2e (apps/web/e2e/*.spec.ts) логинится с одного IP (раннера) десятки раз
      # за несколько минут — с боевым лимитом 60r/m сам прогон упирается в свою же защиту от
      # подбора пароля (найдено 27.10.2026, владелец подтвердил правку). На боевом сервере
      # 10.10.29.70 этот файл не применяется — там лимит остаётся 60r/m (docker-compose.prod.yml).
      EPD_AUTH_RATE: 600r/m
