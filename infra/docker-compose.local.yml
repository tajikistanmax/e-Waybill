# Локальный стенд разработчика — ДОПОЛНЕНИЕ к docker-compose.prod.yml.
# Публикует порты служб на хост: регрессионные скрипты (scripts/*.ps1), автотесты Playwright,
# живые проверки и Swagger ходят на localhost:3000 / 3002 / 8081 / 8082 без прокси.
# На сервере 10.10.29.70 НЕ применять — там снаружи открыт только прокси (HTTPS 443 / 8443).
#
# Запуск локального стека:
#   docker compose -p epd-rt-prod -f docker-compose.prod.yml -f docker-compose.local.yml up -d --build
#
# Keycloak из стека убран 24.09.2026 (вход — в самой платформе), поэтому переопределений его
# адреса здесь больше нет.
services:
  master-data:
    ports:
      - "8081:8081"
    environment:
      # Демо- и QA-учётки из экспорта realm — только на локальном стенде (в prod по умолчанию выкл.).
      AUTH_BOOTSTRAP_REALM_FILE: /opt/epd/auth-import/epd-realm.json
  waybill:
    ports:
      - "8082:8082"
  web:
    ports:
      - "3000:3000"
  public:
    ports:
      - "3002:3002"
