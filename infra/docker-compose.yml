# Dev-окружение платформы ЭПД РТ (Этап 1а, walking skeleton)
# Запуск: docker compose -f infra/docker-compose.yml up -d
name: epd-rt

services:
  postgres:
    image: postgres:16-alpine
    container_name: epd-postgres
    environment:
      POSTGRES_USER: epd
      POSTGRES_PASSWORD: epd_dev_password
      POSTGRES_DB: epd
    ports:
      - "5442:5432"   # 5432 занят локальным PostgreSQL на машине разработчика
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epd"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: epd-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    container_name: epd-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: epd-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_password
      KC_HTTP_PORT: 8180
      # Фиксируем внешний адрес Keycloak, чтобы issuer токенов был стабильным
      # (http://10.10.22.50:8180/realms/epd) для входа с других ПК в локальной сети.
      # Должен совпадать с KEYCLOAK_ISSUER_URI бэкенда и NEXT_PUBLIC_KEYCLOAK_URL web.
      KC_HOSTNAME: http://10.10.22.50:8180
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  minio:
    image: minio/minio:latest
    container_name: epd-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: epd
      MINIO_ROOT_PASSWORD: epd_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
