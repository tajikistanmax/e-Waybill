# Передача запроса службе за прокси.
proxy_http_version 1.1;
proxy_set_header Host $host;
# Адрес клиента ПЕРЕЗАПИСЫВАЕТСЯ, а не дописывается: иначе клиент подставил бы свой
# X-Forwarded-For и обошёл ограничение частоты запросов и подменил IP в журнале аудита
# (службы берут первый адрес из этого заголовка).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Не раскрывать наружу, на чём сделана платформа.
proxy_hide_header X-Powered-By;
proxy_connect_timeout 10s;
# Тяжёлые отчёты (xlsx за год) и печать PDF идут дольше минуты.
proxy_read_timeout 300s;
proxy_send_timeout 300s;
