# Заголовки безопасности для всех ответов (always — и для ошибок 4xx/5xx).
# ВАЖНО: nginx не наследует add_header в location, где есть свой add_header, — поэтому
# заголовки задаются только на уровне server, в location их не добавлять.
add_header X-Content-Type-Options "nosniff" always;
# Запрет встраивания в чужие страницы (кликджекинг); дублирует frame-ancestors из CSP для старых браузеров.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Камера — только своему сайту (сканер QR инспектора); остальное устройству не нужно.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
